appId: com.gunnmilesllc.ffa-transcript-db
productName: FFA Transcript Database
copyright: Copyright © 2026 Gunn Miles LLC

directories:
  buildResources: build
  output: _dist

files:
  - dist/**/*
  - server/**/*
  - electron/**/*
  - package.json
  - "!**/node_modules/*/{CHANGELOG.md,README.md,readme.md,LICENSE,license,*.test.js,*.spec.js,test/**}"
  - "!**/node_modules/.cache"
  - "!**/.{git,vscode,idea}"
  - "!**/{.eslintrc.json,.prettierrc,.gitignore,.npmignore}"

asarUnpack:
  - "node_modules/better-sqlite3-multiple-ciphers/**/*"
  - "node_modules/@ffmpeg-installer/**/*"

# Per-platform extraResources so each build only bundles its own Chromium
# (avoid shipping linux+win Chromium inside the Mac .dmg, and vice versa).
# Source is .puppeteer-bundle/chrome, staged by scripts/stage-puppeteer.mjs
# (run from the dist:electron:* npm scripts) out of ~/.cache/puppeteer/chrome.
# A relative `from:` is portable across machines/CI; a macro-expanded absolute
# path is NOT (electron-builder treats it as project-relative and mangles it).
# NOTE: a macOS build only has the mac_arm Chromium staged; producing working
# win/linux bundles needs `npx puppeteer browsers install chrome` for those
# platforms first. electron/main.cjs wires PUPPETEER_CACHE_DIR to the bundled
# copy at runtime so packaged scraping works without a user-side install.
mac:
  category: public.app-category.education
  target:
    - target: dmg
      arch:
        - arm64
  identity: "WILLIAM MILES (76R466YDPC)"
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
  notarize: false
  extraResources:
    - from: ".puppeteer-bundle/chrome"
      to: "puppeteer-cache/chrome"
      filter:
        - "mac_arm-*/**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
    # Portable .exe — single self-contained executable, no install ceremony, no
    # admin rights needed. Use this if the NSIS installer fails silently
    # (SmartScreen / AV blocking, missing user perms, etc.). The portable
    # extracts to a temp dir and runs — equivalent to the installed app.
    - target: portable
      arch:
        - x64
  # No code signing in this PR — Apple Developer ID does not work for Windows.
  # Users will see SmartScreen "unknown publisher" warning on first run.
  # Future: get an Authenticode cert (~$200/yr) and set 'sign:' here.
  extraResources:
    - from: ".puppeteer-bundle/chrome"
      to: "puppeteer-cache/chrome"
      filter:
        - "win64-*/**/*"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "FFA Transcript Database"

linux:
  category: Education
  target:
    - target: AppImage
      arch:
        - x64
  # AppImages are sandbox-friendly executables. No signing needed; users mark
  # the .AppImage executable and double-click.
  extraResources:
    - from: ".puppeteer-bundle/chrome"
      to: "puppeteer-cache/chrome"
      filter:
        - "linux-*/**/*"

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

publish: null
